<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>國語生字特訓：視網膜級極簡學堂 (Apple Style Unified Canvas)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    :root {
      --bg-global: #F5F5F7;
      --card-bg: #FFFFFF;
      --card-border: rgba(0, 0, 0, 0.06);
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      --card-shadow-hover: 0 14px 32px rgba(0, 0, 0, 0.08);
      --text-primary: #1D1D1F;
      --text-secondary: #6E6E73;
      --text-tertiary: #86868B;
      --apple-blue: #0071E3;
      --apple-blue-light: rgba(0, 113, 227, 0.08);
      --mint-green: #34C759;
      --mint-green-light: rgba(52, 199, 89, 0.12);
      --coral-red: #FF3B30;
      --coral-red-light: rgba(255, 59, 48, 0.12);
      --radius-sm: 10px;
      --radius-md: 18px;
      --radius-lg: 24px;
      --spring-ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    html, body {
      background: var(--bg-global);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro TC", "SF Pro Display", "PingFang TC", "Noto Sans TC", sans-serif;
      overflow: hidden;
      width: 100vw; height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    #app-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100vw; height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px 20px 24px;
      position: relative;
    }

    /* 頂部全域輕量狀態列 (Top Status Bar) */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 58px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 0 20px;
      box-shadow: var(--card-shadow);
      z-index: 10;
    }
    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .avatar-circle {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0071E3, #42a5f5);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 113, 227, 0.25);
    }
    .user-name-text {
      font-size: 14px; font-weight: 600; color: var(--text-primary);
    }
    .user-title-tag {
      font-size: 11px; font-weight: 500; color: var(--text-secondary);
      background: var(--bg-global);
      padding: 2px 8px; border-radius: 6px;
    }

    .vitals-group {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 13px;
      font-weight: 600;
    }
    .vital-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hp-dots {
      display: flex; gap: 4px;
    }
    .hp-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--mint-green);
      transition: all 0.25s;
    }
    .hp-dot.lost {
      background: rgba(0, 0, 0, 0.12);
    }
    .san-badge {
      color: var(--apple-blue);
      background: var(--apple-blue-light);
      padding: 3px 10px; border-radius: 12px;
      font-weight: 700;
    }
    .score-badge {
      font-size: 15px; font-weight: 800; color: var(--apple-blue);
    }

    .top-actions {
      display: flex; align-items: center; gap: 10px;
    }
    .icon-btn {
      background: #FFFFFF;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px; font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s var(--spring-ease);
    }
    .icon-btn:hover, .icon-btn:active {
      background: var(--card-bg);
      color: var(--apple-blue);
      border-color: var(--apple-blue);
      box-shadow: 0 2px 8px rgba(0, 113, 227, 0.12);
    }

    /* 中央字形聚焦舞台 (Center Stage) */
    .center-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px 0;
    }
    .prompt-container {
      text-align: center;
      margin-bottom: 28px;
    }
    .prompt-badge {
      display: inline-block;
      font-size: 12px; font-weight: 600;
      color: var(--apple-blue);
      background: var(--apple-blue-light);
      padding: 4px 14px; border-radius: 20px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    .prompt-title {
      font-size: 26px; font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    .prompt-hint {
      font-size: 15px; font-weight: 500;
      color: var(--text-secondary);
    }

    /* 視網膜級生字卡片展示區 */
    .cards-deck {
      display: flex;
      gap: 24px;
      justify-content: center;
      width: 100%;
      max-width: 860px;
    }
    .word-card {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 38px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--card-shadow);
      transition: all 0.3s var(--spring-ease);
      position: relative;
    }
    .word-card:hover {
      transform: scale(1.03);
      box-shadow: var(--card-shadow-hover);
      border-color: rgba(0, 113, 227, 0.25);
    }
    .word-card:active {
      transform: scale(0.98);
    }
    .card-char {
      font-size: 68px;
      font-weight: 900;
      color: var(--text-primary);
      line-height: 1.1;
      margin-bottom: 10px;
    }
    .card-zhuyin {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-global);
      padding: 4px 14px;
      border-radius: 12px;
    }
    .key-hint {
      position: absolute; top: 12px; left: 16px;
      font-size: 11px; font-weight: 700; color: var(--text-tertiary);
    }

    /* 狀態回饋動態 */
    .word-card.correct-feedback {
      border-color: var(--mint-green) !important;
      background: var(--mint-green-light) !important;
      box-shadow: 0 0 24px rgba(52, 199, 89, 0.35) !important;
      transform: scale(1.04) !important;
    }
    .word-card.shake-feedback {
      border-color: var(--coral-red) !important;
      background: var(--coral-red-light) !important;
      animation: appleShake 0.4s var(--spring-ease);
    }
    @keyframes appleShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    /* 底部水平膠囊導覽列 (Dock-style Pill Navigation) */
    .bottom-dock-container {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 8px 12px;
      box-shadow: var(--card-shadow);
      z-index: 10;
    }
    .dock-scroll-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 4px 0;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .dock-scroll-strip::-webkit-scrollbar { display: none; }
    .dock-pill {
      flex-shrink: 0;
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 30px;
      padding: 8px 18px;
      font-size: 13px; font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.25s var(--spring-ease);
    }
    .dock-pill:hover {
      border-color: var(--apple-blue);
      color: var(--apple-blue);
      transform: translateY(-1px);
    }
    .dock-pill.active {
      background: var(--apple-blue);
      color: #FFFFFF;
      border-color: var(--apple-blue);
      box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
    }
    .dock-pill.hell-mode {
      border-color: rgba(255, 59, 48, 0.3);
      color: var(--coral-red);
    }
    .dock-pill.hell-mode.active {
      background: var(--coral-red);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(255, 59, 48, 0.35);
    }

    /* 登入建立檔案 Modal Sheet */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      opacity: 1; transition: opacity 0.3s var(--spring-ease);
    }
    .modal-card {
      background: #FFFFFF;
      width: 90%; max-width: 440px;
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      border: 1px solid var(--card-border);
      text-align: center;
      animation: modalSlideUp 0.35s var(--spring-ease);
    }
    @keyframes modalSlideUp {
      from { transform: translateY(24px) scale(0.96); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .modal-icon {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--apple-blue-light); color: var(--apple-blue);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; margin: 0 auto 16px auto;
    }
    .modal-title {
      font-size: 22px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px;
    }
    .modal-desc {
      font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.5;
    }
    .apple-input {
      width: 100%; height: 48px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: var(--radius-sm);
      padding: 0 16px;
      font-size: 16px; color: var(--text-primary);
      outline: none; margin-bottom: 20px;
      transition: all 0.2s;
    }
    .apple-input:focus {
      border-color: var(--apple-blue);
      box-shadow: 0 0 0 3px var(--apple-blue-light);
    }
    .apple-btn-primary {
      width: 100%; height: 48px;
      background: var(--apple-blue);
      color: #FFFFFF; border: none;
      border-radius: var(--radius-sm);
      font-size: 16px; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.3);
      transition: all 0.2s;
    }
    .apple-btn-primary:hover {
      background: #0077ED;
      transform: translateY(-1px);
    }
    .apple-btn-primary:active {
      transform: translateY(1px);
    }

    /* 排行榜 Sheet */
    .leaderboard-list {
      max-height: 280px; overflow-y: auto; text-align: left; margin-bottom: 20px;
    }
    .rank-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; border-bottom: 1px solid rgba(0,0,0,0.05);
      font-size: 14px;
    }
    .rank-num { font-weight: 800; color: var(--apple-blue); width: 24px; }
  </style>
</head>
<body>
  <div id="app-container">

    <!-- 頂部全域輕量狀態列 -->
    <header class="top-bar">
      <div class="user-profile-badge" id="btnProfile">
        <div class="avatar-circle" id="avatarChar">學</div>
        <div>
          <div class="user-name-text" id="userCallsign">澄澈學者</div>
          <div class="user-title-tag" id="userRankTitle">字理探尋者</div>
        </div>
      </div>

      <div class="vitals-group">
        <div class="vital-item">
          <span style="color: var(--text-secondary);">生命</span>
          <div class="hp-dots" id="hpDotsContainer">
            <div class="hp-dot"></div>
            <div class="hp-dot"></div>
            <div class="hp-dot"></div>
            <div class="hp-dot"></div>
            <div class="hp-dot"></div>
          </div>
        </div>

        <div class="vital-item">
          <span style="color: var(--text-secondary);">心智 (SAN)</span>
          <span class="san-badge" id="sanValueBadge">100%</span>
        </div>

        <div class="vital-item">
          <span style="color: var(--text-secondary);">進度</span>
          <span style="color: var(--text-primary); font-weight: 700;" id="progressBadge">0 / 10</span>
        </div>

        <div class="vital-item">
          <span style="color: var(--text-secondary);">積分</span>
          <span class="score-badge" id="scoreValueBadge">0</span>
        </div>
      </div>

      <div class="top-actions">
        <button class="icon-btn" id="btnLeaderboard">🏆 排行榜</button>
        <button class="icon-btn" id="btnSwitchUser">👤 切換名稱</button>
      </div>
    </header>

    <!-- 中央字形聚焦舞台 -->
    <main class="center-stage">
      <div class="prompt-container">
        <div class="prompt-badge" id="currentLessonPillTitle">第 1 課：生化疫區前線</div>
        <h1 class="prompt-title" id="targetPromptTitle">鎖定正確生字目標</h1>
        <p class="prompt-hint" id="targetPromptHint">請觀察字形間架結構與注音搭配</p>
      </div>

      <div class="cards-deck" id="cardsDeck">
        <!-- 動態渲染三張視網膜級生字卡片 -->
      </div>
    </main>

    <!-- 底部水平膠囊導覽列 (Dock-style Strip) -->
    <footer class="bottom-dock-container">
      <div class="dock-scroll-strip" id="dockStrip">
        <!-- 1~13 課 ＋ 全冊地獄模式水平膠囊 -->
      </div>
    </footer>
  </div>

  <!-- 登入 / 建立 UserProfile 視窗 -->
  <div class="modal-overlay" id="loginModal" style="display: none;">
    <div class="modal-card">
      <div class="modal-icon"></div>
      <h2 class="modal-title">建立學習檔案</h2>
      <p class="modal-desc">歡迎進入單一畫面的國語生字學習體驗。<br>請輸入您的作戰學習暱稱：</p>
      <input type="text" class="apple-input" id="inputCallsign" placeholder="例如：澄澈思辨者" maxlength="10" autofocus>
      <button class="apple-btn-primary" id="btnConfirmLogin">開始學習旅程</button>
    </div>
  </div>

  <!-- 排行榜視窗 -->
  <div class="modal-overlay" id="leaderboardModal" style="display: none;">
    <div class="modal-card">
      <div class="modal-icon">🏆</div>
      <h2 class="modal-title">特勤學習排行榜</h2>
      <p class="modal-desc">每日與歷史累積最高得分</p>
      <div class="leaderboard-list" id="leaderboardList"></div>
      <button class="apple-btn-primary" id="btnCloseLeaderboard">返回學習舞台</button>
    </div>
  </div>

  <!-- 通關大捷卡片 -->
  <div class="modal-overlay" id="victoryModal" style="display: none;">
    <div class="modal-card">
      <div class="modal-icon" style="background: var(--mint-green-light); color: var(--mint-green);">✓</div>
      <h2 class="modal-title" id="victoryTitle">🎉 課次圓滿完成！</h2>
      <p class="modal-desc" id="victoryDesc">本課生字已全數精準辨析完成。</p>
      <button class="apple-btn-primary" id="btnNextLesson">進入下一課</button>
    </div>
  </div>

    // Web Audio 原生柔和音效合成器 (Apple 柔和調音)
    class AppleSound {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playCorrect(combo = 1) {

          const now = this.ctx.currentTime;
          const baseFreq = 523.25 * Math.pow(1.059463, Math.min(combo, 12));

            const gain = this.ctx.createGain();

            osc.frequency.setValueAtTime(f, now + idx * 0.04);

            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 0.35);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.04); osc.stop(now + idx * 0.04 + 0.35);
          });
        } catch(e) {}
      }
      playError() {

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);

          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.2);
        } catch(e) {}
      }
    }
    const sound = new AppleSound();

    // 狀態機與使用者設定
    let userProfile = null;
    let currentLessonKey = 1;
    let currentPool = [];
    let activeQuestion = null;
    let hp = 5, maxHp = 5;
    let san = 100;
    let score = 0, combo = 0;
    let lessonTotalCount = 0;

    function initUser() {
      const saved = localStorage.getItem('apple_vocab_user');
      if (saved) {
        userProfile = JSON.parse(saved);
        updateUserBadge();
      } else {
        document.getElementById('loginModal').style.display = 'flex';
      }
    }

    document.getElementById('btnConfirmLogin').onclick = () => {
      sound.init();
      const val = document.getElementById('inputCallsign').value.trim() || '澄澈學者';
      userProfile = {
        user_id: 'usr_' + Date.now().toString(36),
        nickname: val,
        title: '字理探尋者',
        all_time_high_score: 0,
        daily_high_score: 0
      };
      localStorage.setItem('apple_vocab_user', JSON.stringify(userProfile));
      document.getElementById('loginModal').style.display = 'none';
      updateUserBadge();
    };

    document.getElementById('btnSwitchUser').onclick = () => {
      document.getElementById('loginModal').style.display = 'flex';
      document.getElementById('inputCallsign').value = userProfile ? userProfile.nickname : '';
    };

    function updateUserBadge() {
      if (!userProfile) return;
      document.getElementById('avatarChar').innerText = userProfile.nickname.charAt(0);
      document.getElementById('userCallsign').innerText = userProfile.nickname;
      document.getElementById('userRankTitle').innerText = userProfile.title;
    }

    // 渲染底部水平膠囊導覽
    function renderDock() {
      const strip = document.getElementById('dockStrip');
      strip.innerHTML = '';

      for (let i = 1; i <= 13; i++) {
        const pill = document.createElement('div');
        pill.className = 'dock-pill' + (currentLessonKey === i ? ' active' : '');
        pill.innerHTML = `<span>L${i < 10 ? '0'+i : i}</span> ${VOCAB_DATABASE[i].title.split('：')[1] || VOCAB_DATABASE[i].title}`;
        pill.onclick = () => {
          sound.init();
          switchLesson(i);
        };
        strip.appendChild(pill);
      }

      // 地獄模式膠囊
      const hellPill = document.createElement('div');
      hellPill.className = 'dock-pill hell-mode' + (currentLessonKey === 'hell' ? ' active' : '');
      hellPill.innerHTML = `<span>🔥</span> 全冊終極大亂鬥 (225字)`;
      hellPill.onclick = () => {
        sound.init();
        switchLesson('hell');
      };
      strip.appendChild(hellPill);
    }

    function switchLesson(key) {
      currentLessonKey = key;
      score = 0; combo = 0; hp = maxHp; san = 100;
      updateVitals();

      if (key === 'hell') {
        let all = [];
        Object.keys(VOCAB_DATABASE).forEach(k => {
          all = all.concat(VOCAB_DATABASE[k].words);
        });
        currentPool = [...all];
        document.getElementById('currentLessonPillTitle').innerText = '🔥 全冊終極大亂鬥';
      } else {
        const lesson = VOCAB_DATABASE[key];
        currentPool = [...lesson.words];
        document.getElementById('currentLessonPillTitle').innerText = lesson.title;
      }
      lessonTotalCount = currentPool.length;
      renderDock();
      spawnNext();
    }

    function spawnNext() {
      if (currentPool.length === 0) {
        showVictory();
        return;
      }
      const randIdx = Math.floor(Math.random() * currentPool.length);
      activeQuestion = currentPool[randIdx];

      document.getElementById('targetPromptTitle').innerText = `【 鎖定「${activeQuestion.word}」字的正確字形 】`;
      document.getElementById('targetPromptHint').innerText = `提示：${activeQuestion.prompt}`;

      updateProgress();

      // 抽取 2 個干擾字
      let allWords = [];
      Object.keys(VOCAB_DATABASE).forEach(k => {
        allWords = allWords.concat(VOCAB_DATABASE[k].words.map(w => w.word));
      });
      allWords = allWords.filter(w => w !== activeQuestion.word);
      const distractors = [];
      while (distractors.length < 2 && allWords.length > 0) {
        const d = allWords[Math.floor(Math.random() * allWords.length)];
        if (!distractors.includes(d)) distractors.push(d);
      }

      const options = [
        { word: activeQuestion.word, isCorrect: true },
        { word: distractors[0], isCorrect: false },
        { word: distractors[1], isCorrect: false }
      ].sort(() => Math.random() - 0.5);

      const deck = document.getElementById('cardsDeck');
      deck.innerHTML = '';

      options.forEach((opt, idx) => {
        const card = document.createElement('div');
        card.className = 'word-card';
        card.innerHTML = `
          <div class="key-hint">鍵 [${idx + 1}]</div>
          <div class="card-char">${opt.word}</div>
          <div class="card-zhuyin">${opt.isCorrect ? activeQuestion.prompt.split(' ')[0] : '干擾字辨析'}</div>
        `;
        card.onclick = () => checkAnswer(opt.isCorrect, card);
        deck.appendChild(card);
      });
    }

    function checkAnswer(isCorrect, cardEl) {
      sound.init();
      if (isCorrect) {
        sound.playCorrect(combo + 1);
        combo++;
        score += 100 + combo * 20;
        cardEl.classList.add('correct-feedback');

        setTimeout(() => {
          currentPool = currentPool.filter(w => w.word !== activeQuestion.word);
          updateVitals();
          spawnNext();
        }, 320);
      } else {
        sound.playError();
        combo = 0;
        hp = Math.max(0, hp - 1);
        san = Math.max(0, san - 15);
        cardEl.classList.add('shake-feedback');
        updateVitals();

        setTimeout(() => {
          cardEl.classList.remove('shake-feedback');
        }, 450);

        if (hp <= 0) {
          alert('生命值歸零！請稍微歇息，重整思緒再出發。');
          hp = maxHp; san = 100;
          switchLesson(currentLessonKey);
        }
      }
    }

    function updateVitals() {
      // 渲染 HP 圓點
      const container = document.getElementById('hpDotsContainer');
      container.innerHTML = '';
      for (let i = 0; i < maxHp; i++) {
        const dot = document.createElement('div');
        dot.className = 'hp-dot' + (i >= hp ? ' lost' : '');
        container.appendChild(dot);
      }
      document.getElementById('sanValueBadge').innerText = san + '%';
      document.getElementById('scoreValueBadge').innerText = score;
    }

    function updateProgress() {
      const cleared = lessonTotalCount - currentPool.length;
      document.getElementById('progressBadge').innerText = `${cleared} / ${lessonTotalCount}`;
    }

    function showVictory() {
      document.getElementById('victoryModal').style.display = 'flex';
      document.getElementById('victoryTitle').innerText = '🎉 課次圓滿完成！';
      document.getElementById('victoryDesc').innerHTML = `本課生字全數通過檢驗！<br><br><strong>最終得分：${score} ｜ 達到最佳專注心流</strong>`;
    }

    document.getElementById('btnNextLesson').onclick = () => {
      document.getElementById('victoryModal').style.display = 'none';
      if (typeof currentLessonKey === 'number' && currentLessonKey < 13) {
        switchLesson(currentLessonKey + 1);
      } else {
        switchLesson(1);
      }
    };

    // 鍵盤 1, 2, 3 快速作答
    window.addEventListener('keydown', e => {
      if (['1', '2', '3'].includes(e.key)) {
        const idx = parseInt(e.key) - 1;
        const cards = document.querySelectorAll('.word-card');
        if (cards[idx]) cards[idx].click();
      }
    });

    // 排行榜 Modal
    document.getElementById('btnLeaderboard').onclick = () => {
      const list = document.getElementById('leaderboardList');
      list.innerHTML = `
        <div class="rank-row"><span class="rank-num">1</span> <span>素樸求真者</span> <strong>5,850 分</strong></div>
        <div class="rank-row"><span class="rank-num">2</span> <span>${userProfile ? userProfile.nickname : '澄澈思辨者'}</span> <strong>${score > 0 ? score : 5400} 分</strong></div>
        <div class="rank-row"><span class="rank-num">3</span> <span>微光行者</span> <strong>4,920 分</strong></div>
        <div class="rank-row"><span class="rank-num">4</span> <span>涵光漫行者</span> <strong>4,310 分</strong></div>
        <div class="rank-row"><span class="rank-num">5</span> <span>字理新星</span> <strong>3,890 分</strong></div>
      `;
      document.getElementById('leaderboardModal').style.display = 'flex';
    };

    document.getElementById('btnCloseLeaderboard').onclick = () => {
      document.getElementById('leaderboardModal').style.display = 'none';
    };

    // 初始化
    initUser();
    switchLesson(1);
  </script>
</body>
</html>
