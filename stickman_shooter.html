<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>火柴人單字特警：五上國語全冊戰役 (QA Verified)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none; /* 防止移動端拖曳與雙擊縮放 */
    }
    html, body {
      background: #040706;
      color: #e0f0e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      overflow: hidden;
      width: 100vw; height: 100vh;
      overscroll-behavior: none;
    }
    #game-container {
      position: relative;
      width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #091510 0%, #030504 95%);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%; height: 100%;
    }

    /* 頂部戰術 HUD */
    .hud-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 14px 20px;
      z-index: 5;
    }
    .hud-top {
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .hud-card {
      pointer-events: auto;
      background: rgba(8, 16, 12, 0.94);
      border: 1px solid rgba(0, 255, 136, 0.45);
      border-radius: 8px; padding: 10px 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
    }
    .question-box {
      text-align: center; min-width: 380px;
      border-color: #00ff88;
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.35);
    }
    .question-hint {
      font-size: 11px; color: #88c0a0; letter-spacing: 1px; margin-bottom: 2px;
    }
    .question-target {
      font-size: 26px; font-weight: 900; color: #ffdf5d;
      text-shadow: 0 0 14px rgba(255, 223, 93, 0.7);
    }
    .stats-card {
      display: flex; gap: 14px; font-size: 13px; font-weight: bold; align-items: center;
    }
    .stat-val {
      color: #00ff88; font-size: 17px; margin-left: 4px;
    }
    .health-bar-container {
      width: 130px; height: 9px; background: #1a2620; border-radius: 4px;
      overflow: hidden; margin-top: 5px; border: 1px solid #2a3d33;
    }
    .health-bar-fill {
      width: 100%; height: 100%;
      background: linear-gradient(90deg, #ff3344, #00ff88);
      transition: width 0.2s;
    }
    .lobby-btn {
      background: rgba(0, 255, 136, 0.15);
      border: 1px solid #00ff88;
      color: #00ff88;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: all 0.15s;
    }
    .lobby-btn:hover, .lobby-btn:active {
      background: #00ff88;
      color: #040706;
    }

    /* 戰役選關大廳 */
    .menu-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(4, 8, 6, 0.95);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 10; backdrop-filter: blur(12px);
      padding: 20px;
    }
    .menu-header {
      text-align: center; margin-bottom: 14px;
    }
    .menu-title {
      font-size: 32px; font-weight: 900; color: #00ff88;
      letter-spacing: 3px; text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
    }
    .menu-subtitle {
      font-size: 13px; color: #88c0a0; margin-top: 4px;
    }
    .campaign-grid-container {
      width: 100%; max-width: 960px; max-height: 64vh;
      overflow-y: auto; padding: 12px;
      background: rgba(10, 20, 15, 0.6);
      border: 1px solid rgba(0, 255, 136, 0.25);
      border-radius: 10px;
    }
    .campaign-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .level-btn {
      background: rgba(16, 30, 22, 0.85);
      border: 1px solid rgba(0, 255, 136, 0.35);
      border-radius: 6px; padding: 10px 12px;
      cursor: pointer; transition: all 0.15s;
      text-align: left; display: flex; flex-direction: column; justify-content: space-between;
    }
    .level-btn:hover, .level-btn:active {
      background: #00ff88; color: #040806;
      transform: translateY(-2px);
      box-shadow: 0 0 18px rgba(0, 255, 136, 0.6);
    }
    .level-btn:hover .level-num, .level-btn:hover .level-info, .level-btn:hover .level-name,
    .level-btn:active .level-num, .level-btn:active .level-info, .level-btn:active .level-name {
      color: #040806 !important;
    }
    .level-num {
      font-size: 10px; font-weight: bold; color: #ffaa00; letter-spacing: 1px;
    }
    .level-name {
      font-size: 13px; font-weight: bold; margin: 3px 0; color: #fff;
    }
    .level-info {
      font-size: 11px; color: #7dbf96;
    }
    .hell-card {
      grid-column: span 4;
      background: rgba(45, 12, 16, 0.85);
      border: 2px solid #ff3344;
      text-align: center; padding: 12px;
    }
    .hell-card:hover, .hell-card:active {
      background: #ff3344; color: #fff;
      box-shadow: 0 0 25px rgba(255, 51, 68, 0.8);
    }
    .hell-card .level-name {
      font-size: 15px; color: #ff6677;
    }
    .hell-card:hover .level-name, .hell-card:hover .level-info, .hell-card:hover .level-num,
    .hell-card:active .level-name, .hell-card:active .level-info, .hell-card:active .level-num {
      color: #fff !important;
    }
  </style>
</head>

    // Web Audio 原生合成器
    class SoundEngine {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playShoot() {
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(750, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.08);
        } catch(e) {}
      }
      playHitCorrect(combo = 1) {
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const freq = 523.25 * Math.pow(2, Math.min(combo, 14) / 12);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.setValueAtTime(freq * 1.5, now + 0.05);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.25);
        } catch(e) {}
      }
      playHitWrong() {
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "square";
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.setValueAtTime(90, now + 0.1);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.2);
        } catch(e) {}
      }
      playExplode() {
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const bufferSize = this.ctx.sampleRate * 0.25;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const out = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) out[i] = Math.random() * 2 - 1;
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(550, now);
          filter.frequency.linearRampToValueAtTime(90, now + 0.25);
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
          noise.start(now);
        } catch(e) {}
      }
      playVictory() {
        if (!this.ctx) return;
        try {
          [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
            const now = this.ctx.currentTime + idx * 0.08;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(f, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.35);
          });
        } catch(e) {}
      }
    }

    const sound = new SoundEngine();

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    }, { passive: true });

    let bullets = [], targets = [], particles = [], floatingTexts = [];

    // ==========================================
    // 火柴人主角物件
    // ==========================================
    const player = {
      x: screenW / 2, y: screenH / 2, radius: 24, speed: 5.5, angle: 0, runCycle: 0,
      shoot() {
        totalShots++;
        sound.playShoot();
        screenShake = Math.max(screenShake, 5);
        const gunLen = 38;
        const bx = this.x + Math.cos(this.angle) * gunLen;
        const by = this.y + Math.sin(this.angle) * gunLen;
        bullets.push({ x: bx, y: by, vx: Math.cos(this.angle) * 18, vy: Math.sin(this.angle) * 18, life: 75 });

        for (let i = 0; i < 8; i++) {
          particles.push({
            x: bx, y: by,
            vx: Math.cos(this.angle + (Math.random() - 0.5)) * (4 + Math.random() * 5),
            vy: Math.sin(this.angle + (Math.random() - 0.5)) * (4 + Math.random() * 5),
            color: "#ffdf5d", radius: 2 + Math.random() * 3, alpha: 1, decay: 0.12
          });
        }
      },
      update() {
        let dx = 0, dy = 0;
        if (keys["w"] || keys["arrowup"]) dy -= 1;
        if (keys["s"] || keys["arrowdown"]) dy += 1;
        if (keys["a"] || keys["arrowleft"]) dx -= 1;
        if (keys["d"] || keys["arrowright"]) dx += 1;
        if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
        this.x += dx * this.speed;
        this.y += dy * this.speed;

        this.x = Math.max(45, Math.min(screenW - 45, this.x));
        this.y = Math.max(90, Math.min(screenH - 45, this.y));

        if (dx !== 0 || dy !== 0) this.runCycle += 0.25;

        const diffX = mouse.x - this.x;
        const diffY = mouse.y - this.y;
        if (Math.abs(diffX) > 1 || Math.abs(diffY) > 1) {
          this.angle = Math.atan2(diffY, diffX);
        }
      },
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // 呼吸光圈
        ctx.strokeStyle = "rgba(0, 255, 136, 0.4)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 32 + Math.sin(Date.now() * 0.005) * 4, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = "rgba(0, 255, 136, 0.08)";
        ctx.beginPath();
        ctx.arc(0, 0, 32, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.rotate(this.angle);

        // 紅外線瞄準線
        ctx.strokeStyle = "rgba(255, 50, 50, 0.35)";
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(35, 6);
        ctx.lineTo(240, 6);
        ctx.stroke();
        ctx.setLineDash([]);

        // 步槍槍管
        ctx.strokeStyle = "#5a6872";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(8, 6);
        ctx.lineTo(36, 6);
        ctx.stroke();

        // 槍身指示燈
        ctx.fillStyle = "#00ff88";
        ctx.fillRect(20, 2, 8, 3);

        // 手臂
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(0, -8);
        ctx.lineTo(16, 6);
        ctx.moveTo(0, 8);
        ctx.lineTo(26, 6);
        ctx.stroke();

        // 頭部
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.fill();

        // 戰術護目鏡
        ctx.strokeStyle = "#00ff88";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(5, 0, 10, -0.6, 0.6);
        ctx.stroke();

        ctx.restore();

        // 奔跑雙腿
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3.5;
        const leg = Math.sin(this.runCycle) * 14;
        ctx.beginPath();
        ctx.moveTo(-5, 12);
        ctx.lineTo(-5 - leg, 28);
        ctx.moveTo(5, 12);
        ctx.lineTo(5 + leg, 28);
        ctx.stroke();

        // 標籤
        ctx.font = "bold 11px sans-serif";
        ctx.fillStyle = "#00ff88";
        ctx.textAlign = "center";
        ctx.fillText("特警 PLAYER", 0, -22);

        ctx.restore();
      }
    };

    // ==========================================
    // 生字靶機實體 (高對比度、可視區環形生成)
    // ==========================================
    class WordTarget {
      constructor(word, isCorrect, angleSlot, speedMult = 1) {
        this.word = word;
        this.isCorrect = isCorrect;
        this.radius = 36;

        // 在玩家周圍半徑 280~380px 的可視區生成
        const dist = Math.min(screenW, screenH) * 0.38 + 50;
        this.x = player.x + Math.cos(angleSlot) * dist;
        this.y = player.y + Math.sin(angleSlot) * dist;

        this.x = Math.max(50, Math.min(screenW - 50, this.x));
        this.y = Math.max(120, Math.min(screenH - 50, this.y));

        this.speed = (1.1 + Math.random() * 0.4) * speedMult;
        this.hp = 1;
        this.wobble = Math.random() * 10;
      }
      update() {
        this.wobble += 0.05;
        const a = Math.atan2(player.y - this.y, player.x - this.x);
        this.x += Math.cos(a) * this.speed;
        this.y += Math.sin(a) * this.speed;

        const dist = Math.hypot(player.x - this.x, player.y - this.y);
        if (dist < player.radius + this.radius) {
          playerHp = Math.max(0, playerHp - 15);
          sound.playHitWrong();
          screenShake = 14; combo = 0; updateHUD();
          createExplosion(this.x, this.y, "#ff3344", 25);
          this.hp = 0;
          if (playerHp <= 0) endGame(false);
        }
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y + Math.sin(this.wobble) * 4);

        ctx.fillStyle = "rgba(25, 42, 34, 0.95)";
        ctx.strokeStyle = "#00ff88";
        ctx.lineWidth = 3;

        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const ang = (i * Math.PI) / 3;
          const px = Math.cos(ang) * this.radius;
          const py = Math.sin(ang) * this.radius;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#ffaa00";
        ctx.beginPath();
        ctx.arc(0, -this.radius, 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = "900 28px -apple-system, sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(this.word, 0, 1);

        ctx.restore();
      }
    }

    function createExplosion(x, y, color, count = 20) {
      for (let i = 0; i < count; i++) {
        const speed = 2 + Math.random() * 8, a = Math.random() * Math.PI * 2;
        particles.push({
          x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
          color, radius: 2.5 + Math.random() * 3.5, alpha: 1, decay: 0.03 + Math.random() * 0.03
        });
      }
    }

    function addFloatingText(x, y, text, color) {
      floatingTexts.push({ x, y, text, color, alpha: 1, vy: -2.0 });
    }

    function spawnQuestionWave() {
      if (currentWordPool.length === 0) {
        endGame(true);
        return;
      }
      const randIdx = Math.floor(Math.random() * currentWordPool.length);
      activeQuestion = currentWordPool[randIdx];

      document.getElementById("currentPrompt").innerText = activeQuestion.prompt;
      updateHUD();

      let allWordsList = [];
      Object.keys(VOCAB_DATABASE).forEach(k => {
        allWordsList = allWordsList.concat(VOCAB_DATABASE[k].words.map(w => w.word));
      });
      allWordsList = allWordsList.filter(w => w !== activeQuestion.word);
      const distractors = shuffleArray(allWordsList).slice(0, 3);

      const candidates = [
        { word: activeQuestion.word, isCorrect: true },
        ...distractors.map(d => ({ word: d, isCorrect: false }))
      ];

      const shuffledOptions = shuffleArray(candidates);

      targets = [];
      const speedMult = currentLessonKey === 'hell' ? 1.45 : 1.0;
      const angleOffsets = [0.785, 2.356, 3.927, 5.497];
      const shuffledAngles = shuffleArray(angleOffsets);

      shuffledOptions.forEach((opt, idx) => {
        targets.push(new WordTarget(opt.word, opt.isCorrect, shuffledAngles[idx], speedMult));
      });
    }

    function updateHUD() {
      document.getElementById("scoreVal").innerText = score;
      document.getElementById("comboVal").innerText = combo + "x";
      document.getElementById("remainVal").innerText = currentWordPool.length;
      document.getElementById("hpBar").style.width = playerHp + "%";
    }

    function startLevel(key) {
      sound.init();
      currentLessonKey = key;
      gameState = "PLAYING";
      score = 0; combo = 0; maxCombo = 0; totalShots = 0; hits = 0; playerHp = 100;
      
      resize();
      player.x = screenW / 2;
      player.y = screenH / 2;
      mouse.x = player.x;
      mouse.y = player.y - 120;

      bullets = []; particles = []; floatingTexts = [];

      document.getElementById("menuOverlay").style.display = "none";
      document.getElementById("hudLayer").style.display = "flex";

      if (key === 'hell') {
        let allPool = [];
        Object.keys(VOCAB_DATABASE).forEach(k => {
          allPool = allPool.concat(VOCAB_DATABASE[k].words);
        });
        currentWordPool = shuffleArray(allPool);
        document.getElementById("modeName").innerText = "🔥 全冊終極地獄無盡關";
      } else {
        const lesson = VOCAB_DATABASE[key];
        currentWordPool = shuffleArray(lesson.words);
        document.getElementById("modeName").innerText = lesson.title;
      }
      spawnQuestionWave();
    }

    function returnToLobby() {
      gameState = "MENU";
      document.getElementById("menuOverlay").style.display = "flex";
      document.getElementById("hudLayer").style.display = "none";
      renderLevelGrid();
    }

    document.getElementById("btnReturnLobby").addEventListener("click", e => {
      e.stopPropagation();
      returnToLobby();
    });

    function endGame(victory) {
      gameState = victory ? "VICTORY" : "GAMEOVER";
      const overlay = document.getElementById("menuOverlay");
      const title = document.getElementById("menuTitle");
      const sub = document.getElementById("menuSubtitle");
      overlay.style.display = "flex";
      const acc = totalShots > 0 ? Math.round((hits / totalShots) * 100) : 0;

      if (victory) {
        sound.playVictory(); screenShake = 16;
        title.innerText = "MISSION ACCOMPLISHED!";
        title.style.color = "#00ff88";
        sub.innerHTML = `恭喜完全通關！本課所有生字全數驗證完畢！<br><br><strong style="color: #fff; font-size: 17px;">最終得分：${score} ｜ 命中率：${acc}% ｜ 最大連擊：${maxCombo}x</strong>`;
      } else {
        sound.playHitWrong();
        title.innerText = "TACTICAL FAILURE";
        title.style.color = "#ff3344";
        sub.innerHTML = `特警裝甲耐久歸零！未能肅清全部生字目標！<br><br><strong style="color: #fff; font-size: 17px;">最終得分：${score} ｜ 剩餘生字：${currentWordPool.length}</strong>`;
      }
      renderLevelGrid();
    }

    function renderLevelGrid() {
      const grid = document.getElementById("campaignGrid");
      grid.innerHTML = "";

      for (let i = 1; i <= 13; i++) {
        const lesson = VOCAB_DATABASE[i];
        const btn = document.createElement("div");
        btn.className = "level-btn";
        btn.innerHTML = `
          <div class="level-num">LESSON ${i < 10 ? '0' + i : i}</div>
          <div class="level-name">${lesson.title}</div>
          <div class="level-info">收錄生字：${lesson.words.length} 個</div>
        `;
        btn.onclick = (e) => {
          e.stopPropagation();
          startLevel(i);
        };
        grid.appendChild(btn);
      }

      const hellBtn = document.createElement("div");
      hellBtn.className = "level-btn hell-card";
      hellBtn.innerHTML = `
        <div class="level-num" style="color: #ff3344;">HELL MODE // 全冊大亂鬥</div>
        <div class="level-name">🔥 全冊終極地獄無盡關 (第 1~13 課全部 220+ 生字隨機抽測)</div>
        <div class="level-info">怪物移速提升 45% ｜ 必須肅清全冊生字方能通關</div>
      `;
      hellBtn.onclick = (e) => {
        e.stopPropagation();
        startLevel('hell');
      };
      grid.appendChild(hellBtn);
    }

    renderLevelGrid();

    // ==========================================
    // 遊戲主循環
    // ==========================================
    function gameLoop() {
      try {
        ctx.save();
        if (screenShake > 0) {
          ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
          screenShake *= 0.88;
          if (screenShake < 0.5) screenShake = 0;
        }

        ctx.fillStyle = "#070b09";
        ctx.fillRect(0, 0, screenW, screenH);

        ctx.strokeStyle = "rgba(0, 255, 136, 0.04)";
        ctx.lineWidth = 1;
        for (let x = 0; x < screenW; x += 45) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, screenH); ctx.stroke();
        }
        for (let y = 0; y < screenH; y += 45) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(screenW, y); ctx.stroke();
        }

        if (gameState === "PLAYING") {
          player.update();
          player.draw();

          for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;
            b.life--;

            ctx.strokeStyle = "#ffdf5d";
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(b.x, b.y);
            ctx.lineTo(b.x - b.vx * 0.75, b.y - b.vy * 0.75);
            ctx.stroke();

            let removed = false;
            for (let j = targets.length - 1; j >= 0; j--) {
              const t = targets[j];
              if (Math.hypot(t.x - b.x, t.y - b.y) < t.radius) {
                hits++; removed = true;
                if (t.isCorrect) {
                  combo++; maxCombo = Math.max(maxCombo, combo);
                  const earned = 100 + combo * 25;
                  score += earned;

                  sound.playHitCorrect(combo);
                  sound.playExplode();
                  screenShake = 12;

                  createExplosion(t.x, t.y, "#00ff88", 32);
                  addFloatingText(t.x, t.y, `+${earned} CRITICAL!`, "#00ff88");
                  if (combo > 1) addFloatingText(t.x, t.y - 25, `${combo}x COMBO!`, "#ffdf5d");

                  currentWordPool = currentWordPool.filter(w => w.word !== activeQuestion.word);
                  spawnQuestionWave();
                  break;
                } else {
                  combo = 0; playerHp = Math.max(0, playerHp - 10);
                  sound.playHitWrong();
                  screenShake = 10;
                  createExplosion(t.x, t.y, "#ff3344", 20);
                  addFloatingText(t.x, t.y, "MISS / 誤擊干擾字 -10HP", "#ff3344");
                  targets.splice(j, 1);
                  updateHUD();
                  if (playerHp <= 0) endGame(false);
                  break;
                }
              }
            }
            if (removed || b.life <= 0) bullets.splice(i, 1);
          }

          for (let i = targets.length - 1; i >= 0; i--) {
            const t = targets[i];
            t.update();
            t.draw();
            if (t.hp <= 0) targets.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
          if (p.alpha <= 0) { particles.splice(i, 1); continue; }
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.alpha;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1.0;
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          const ft = floatingTexts[i];
          ft.y += ft.vy; ft.alpha -= 0.02;
          if (ft.alpha <= 0) { floatingTexts.splice(i, 1); continue; }
          ctx.save();
          ctx.globalAlpha = ft.alpha;
          ctx.font = "bold 16px sans-serif";
          ctx.fillStyle = ft.color;
          ctx.textAlign = "center";
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        }

        if (gameState === "PLAYING") {
          ctx.strokeStyle = "#00ff88";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(mouse.x, mouse.y, 10, 0, Math.PI * 2);
          ctx.moveTo(mouse.x - 16, mouse.y); ctx.lineTo(mouse.x - 3, mouse.y);
          ctx.moveTo(mouse.x + 3, mouse.y); ctx.lineTo(mouse.x + 16, mouse.y);
          ctx.moveTo(mouse.x, mouse.y - 16); ctx.lineTo(mouse.x, mouse.y - 3);
          ctx.moveTo(mouse.x, mouse.y + 3); ctx.lineTo(mouse.x, mouse.y + 16);
          ctx.stroke();
        }

        ctx.restore();
      } catch (err) {
        console.error('GameLoop Exception:', err);
      }
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
  </script>
</body>
